
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Personal Profile</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #100b2e;
            margin: 0;
            padding: 30px 15px;
            min-height: 100vh;
            position: relative;
            isolation: isolate;
            overflow-x: hidden;
        }

        /* Moving Neon Background */
        body::before {
            content: "";
            position: fixed;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;

            background: conic-gradient(
                transparent,
                #8a2be2,
                #00e5ff,
                transparent,
                #ff00cc,
                #8a2be2,
                transparent
            );

            filter: blur(80px);
            opacity: 0.55;
            animation: neonMove 12s linear infinite;
            z-index: -1;
            pointer-events: none;
        }

        /* Neon Background Animation */
        @keyframes neonMove {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        /* Main Form Container */
        .container {
            background: white;
            max-width: 500px;
            margin: 30px auto;
            padding: 30px;
            border-radius: 15px;

            animation: neonGlow 3s infinite alternate;
        }

        /* Animated Neon Glow */
        @keyframes neonGlow {
            0% {
                box-shadow:
                    0 0 10px #764ba2,
                    0 0 20px #a855f7;
            }

            50% {
                box-shadow:
                    0 0 20px #c084fc,
                    0 0 40px #9333ea;
            }

            100% {
                box-shadow:
                    0 0 30px #e9d5ff,
                    0 0 50px #a855f7,
                    0 0 70px #764ba2;
            }
        }

        h1 {
            text-align: center;
            color: #764ba2;
        }

        p {
            text-align: center;
            color: #777;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input, select, textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 14px;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #9333ea;
            box-shadow: 0 0 8px #c084fc;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            background: #764ba2;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #5b3c99;
            box-shadow: 0 0 15px #a855f7,
                        0 0 25px #9333ea;
            transform: translateY(-2px);
        }

    </style>
</head>

<body>

    <div class="container">

        <h1>My Personal Profile</h1>

        <p>Please fill in your personal information.</p>

        <form action="ProfileServlet" method="post">

            <label>Full Name</label>
            <input type="text" name="name"
                   placeholder="Enter your full name" required>

            <label>Student ID</label>
            <input type="text" name="studentId"
                   placeholder="Enter your student ID" required>

            <label>Programme</label>
            <input type="text" name="programme"
                   placeholder="Enter your programme" required>

            <label>Email Address</label>
            <input type="email" name="email"
                   placeholder="Enter your email" required>

            <label>Hobbies</label>
            <input type="text" name="hobbies"
                   placeholder="Enter your hobbies" required>

            <label>Short Self-Introduction</label>
            <textarea name="introduction"
                      placeholder="Tell us about yourself..."
                      required></textarea>

            <button type="submit">Submit Profile</button>

        </form>

    </div>

</body>
</html>
